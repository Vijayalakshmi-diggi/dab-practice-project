# This is a Declarative Automation Bundle definition for dab_practice_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_practice_project
  uuid: 5cbd474e-f4ac-468b-9564-8d782cba876a

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: DAB_bundles
  schema:
    description: bundle

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-2ae71acf-8793.cloud.databricks.com?w=7474659794472006
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-2ae71acf-8793.cloud.databricks.com?w=7474659794472006
      # We explicitly deploy to /Workspace/Users/vijayalakshmi@diggibyte.com to make sure we only have a single copy.
      root_path: /Workspace/Users/vijayalakshmi@diggibyte.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: vijayalakshmi@diggibyte.com
        level: CAN_MANAGE
